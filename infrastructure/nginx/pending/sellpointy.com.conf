# Vhost del APEX sellpointy.com — el SITIO PÚBLICO (F11-SITE-INFRA-02).
#
# ⚠️ ESTE ARCHIVO NO ESTÁ ENCENDIDO, Y ESO ES A PROPÓSITO.
#
# `deploy.yml` copia `nginx/conf.d/` y `nginx/snippets/` completos a
# PRODUCCIÓN en CADA push a main (paso «copiar compose, nginx y php-fpm») y
# después corre `nginx -t && nginx -s reload`. O sea: cualquier archivo que
# viva en `conf.d/` está publicado desde el siguiente push, sin que nadie
# decida nada. El sitio todavía NO se puede publicar —sus textos legales
# tienen huecos `[[…]]` que solo el dueño puede llenar (F11-SITE-LEGAL-01)—,
# así que este vhost vive en `pending/`, que el pipeline NO copia.
#
# Mover este archivo a `conf.d/` ES el interruptor. El paso a paso completo
# —incluido QUITAR los dos `server` del apex que hoy viven al final de
# `conf.d/app.sellpointy.com.conf` y hacen el 301 a `app.`— está en
# `pending/README.md`. No hay nada que emitir: el apex ya es un SAN del
# certificado de la app.
#
# El formato de log `noquery` (tokens fuera de los logs) vive en
# `conf.d/01-noquery-log.conf`, igual que para los demás vhosts.

# ── Presupuesto por IP del único prefijo del API que el apex reenvía ──────
#
# La zona se declara ACÁ, en el mismo archivo del vhost, y no en
# `conf.d/02-ratelimit.conf` como las de `/auth/*`. Razón: `02-ratelimit.conf`
# vive en `conf.d/` y viaja a producción en el próximo push — declarar allí
# una zona para un vhost que todavía no existe sería encender media cosa.
# `limit_req_zone` es válido en el contexto `http`, y un archivo de `conf.d/`
# ESTÁ en el contexto `http`: al mover este archivo, la zona y el vhost
# aterrizan juntos, en un solo movimiento y sin pasos intermedios.
#
# ⚠️ Si algún día esta zona se muda a `02-ratelimit.conf`, hay que BORRARLA de
# acá en el mismo commit: dos `limit_req_zone` con el mismo nombre hacen
# fallar `nginx -t`, y ese `nginx -t` corre en cada deploy de producción.
#
# 120r/m con burst 60: el mismo orden de magnitud que el presupuesto fino del
# API (`SITE_THROTTLES.event`: 120 eventos por minuto y por IP). Acá no se
# busca precisión —una oficina entera comparte una IP por NAT— sino que un
# robot que martille no llegue siquiera a gastar un worker de Nest.
limit_req_zone $binary_remote_addr zone=site_public_ip:1m rate=120r/m;

server {
    listen 80;
    server_name sellpointy.com www.sellpointy.com;

    access_log /var/log/nginx/access.log noquery;

    include /etc/nginx/snippets/acme.inc;

    # `www` aparece acá y SOLO acá. El certificado de hoy no lo cubre (ver el
    # bloque :443), así que servirlo por :443 daría un error de certificado,
    # que es peor que no servirlo. En :80 no arriesga nada y gana dos cosas:
    # quien teclee `http://www…` aterriza en el apex, y certbot puede resolver
    # el HTTP-01 de `www` el día que se reemita el certificado con ese SAN.
    #
    # El destino es el apex LITERAL, no `https://$host`: con `$host`, un `www`
    # sin certificado mandaría al navegador justo al error que se quiere evitar.
    location / {
        return 301 https://sellpointy.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sellpointy.com;

    access_log /var/log/nginx/access.log noquery;

    # El MISMO lineage que la app: el apex ya es un SAN de
    # `/etc/letsencrypt/live/app.sellpointy.com/` (el docblock de
    # `conf.d/app.sellpointy.com.conf` lista los SAN emitidos el 2026-08-27:
    # `sellpointy.com` y `sandbox.sellpointy.com`). Por eso encender el sitio
    # no necesita etapa de bootstrap ni emisión nueva — es mover un archivo.
    #
    # `www.sellpointy.com` NO está entre esos SAN y por eso NO se declara en
    # este `server_name`. Pendiente del dueño: reemitir el lineage agregando
    # ese SAN (ver `pending/README.md`, sección «www»).
    ssl_certificate     /etc/letsencrypt/live/app.sellpointy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sellpointy.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.inc;

    # El apex va en gris (sin Cloudflare por delante), igual que app: estos
    # headers son la ÚNICA capa.
    include /etc/nginx/snippets/security-headers.inc;

    # ── CSP ESTRICTA, y acá sí se puede ──────────────────────────────────
    #
    # La app corre con una CSP pragmática (`default-src 'self'`, Sentry
    # abierto, `blob:` para el escáner y el PDF) porque es una SPA que hace de
    # todo. El sitio es HTML ya armado que no carga NADA de afuera, así que
    # arranca en `default-src 'none'` y se abre solo lo que el HTML construido
    # realmente usa. Verificado contra `apps/site/dist`: cero recursos de otro
    # origen, cero `data:` en imágenes, cero atributos `style=`, cero `on*=`.
    #
    # `script-src` por HASH y no `'unsafe-inline'`: el sitio tiene UN guion en
    # línea, el que decide el tema antes del primer pintado
    # (`apps/site/src/layouts/Base.astro`, `<script is:inline>`). Va en línea a
    # propósito —un `defer` haría parpadear la página en blanco— y por eso la
    # CSP lo autoriza por su sha256. Si ese guion cambia una coma, el hash
    # cambia y el tema deja de aplicarse: `infrastructure/scripts/site-csp-hash.sh`
    # lo recalcula desde el HTML construido y falla si no coincide con esta
    # línea. Corre en el job `build` de `site.yml`, antes de empaquetar.
    #
    # `style-src 'unsafe-inline'` y NO hashes — decisión, no pereza:
    #  · los `<style>` en línea del sitio los genera Astro con los `@font-face`
    #    de las tres familias, y su contenido lleva el nombre de la fuente con
    #    HUELLA DE BUILD ("Bricolage Grotesque-fbbedda2de103f23"): cambia sola
    #    cada vez que cambian las fuentes o su configuración;
    #  · en CSP nivel 3, listar un hash en una directiva HACE QUE SE IGNORE
    #    `'unsafe-inline'` en esa misma directiva: es todo o nada, no se puede
    #    dejar un hash «por si acaso» y el resto abierto;
    #  · lo que compra un `style-src` cerrado es evitar exfiltración por CSS
    #    inyectado, y acá no hay NADA que inyecte: es HTML estático sin
    #    contenido de terceros ni de usuarios, y hoy ni siquiera hay un solo
    #    atributo `style=` en el build;
    #  · el vhost de la app ya resolvió lo mismo igual (`style-src 'self'
    #    'unsafe-inline'`, por el runtime de Tailwind).
    # El riesgo real vive en `script-src`, y ese SÍ está cerrado y con barrera.
    #
    # `connect-src 'self'` alcanza porque la medición y el formulario pegan al
    # MISMO origen (`/api/public/…`, reenviado más abajo). Nada de Sentry: el
    # sitio no lo carga.
    #
    # La CSP se escribe UNA vez en esta variable porque hay que repetirla en el
    # `location` de /_astro/ (ver el gotcha de `add_header` más abajo), y dos
    # copias literales de una cadena de 300 caracteres se separan solas.
    set $site_csp "default-src 'none'; script-src 'self' 'sha256-gfux6XwrryKoWtEUI41qNc2pOgLjoSzTu4EnLofFdYU='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'";
    add_header Content-Security-Policy $site_csp always;

    # ⚠️ La ruta es la de DENTRO del contenedor. En el server los archivos
    # viven en `/opt/sites/…` —ahí escribe `site-deploy-remote.sh`— y el
    # compose los monta en `/var/www/sites`:
    #   docker-compose.prod.yml, nginx-edge: `- /opt/sites:/var/www/sites:ro`
    # Poner `/opt/sites` acá daría un 404 eterno con los archivos
    # perfectamente publicados. El mount es `:ro` a propósito: nginx sirve,
    # el deploy escribe desde el host.
    #
    # `public` es un ENLACE SIMBÓLICO a la release vigente, y por eso el
    # cambio de versión es atómico. No hace falta `disable_symlinks off`: ese
    # ya es el comportamiento de fábrica de nginx. Lo que NO se puede poner
    # acá es `disable_symlinks on`, que rompería el sitio entero.
    root /var/www/sites/sellpointy.com/public;
    index index.html;

    # La 404 del sitio (`apps/site/src/pages/404.astro` → `dist/404.html`).
    # Si ese archivo no existiera, nginx responde su propia 404 y no hay bucle.
    error_page 404 /404.html;

    # ── gzip ─────────────────────────────────────────────────────────────
    #
    # NO viene encendido: la imagen `nginx:alpine` trae `#gzip on;` comentado
    # en su `nginx.conf` y este repo no monta un `nginx.conf` propio (el
    # compose solo monta `conf.d/` y `snippets/`). Se enciende acá, en el
    # único vhost que sirve archivos de texto desde disco — los demás son
    # proxies y comprimir dos veces no tiene sentido.
    #
    # `text/html` NO se lista: nginx SIEMPRE lo comprime cuando gzip está
    # encendido, y repetirlo solo produce un warning de tipo duplicado.
    # `woff2` tampoco: ya viene comprimido, recomprimirlo gasta CPU y no baja
    # un byte.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml;

    # ── Caché ────────────────────────────────────────────────────────────
    #
    # ⚠️ EL GOTCHA DE `add_header` EN NGINX: los `add_header` NO se acumulan
    # entre niveles. Si un `location` declara UNO SOLO, nginx DESCARTA todos
    # los del `server` para esa respuesta. O sea que un `add_header
    # Cache-Control` puesto sin pensar apaga en silencio la CSP, el HSTS, el
    # nosniff y el Permissions-Policy — y nadie se entera, porque la página
    # sigue viéndose bien.
    #
    # Acá se resuelve con dos técnicas, según lo que haga falta:
    #  · `expires`, que NO es un `add_header`: pone `Cache-Control` y
    #    `Expires` sin tocar la herencia. Es lo que se usa donde alcanza.
    #  · donde no alcanza —`immutable` no se puede expresar con `expires`— se
    #    vuelven a INCLUIR los mismos snippets del server. Se re-incluyen en
    #    vez de copiarse a mano para que no puedan separarse.

    # Los archivos con huella de contenido en el nombre: si cambia el archivo,
    # cambia la URL, así que se pueden cachear para siempre. `immutable` le
    # dice al navegador que ni siquiera revalide al recargar.
    #
    # `^~` y no un prefijo pelado: sin él, la regex de los íconos de más abajo
    # le ganaría a `/_astro/logo-….svg` y ese archivo perdería el `immutable`.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # El `add_header` de arriba borró los heredados: se re-incluyen.
        include /etc/nginx/snippets/security-headers.inc;
        # La CSP también, y no por trámite: `/_astro/` sirve SVG
        # (`logo-….svg`), y un SVG abierto como DOCUMENTO ejecuta sus scripts
        # en este origen. Sin CSP acá, esa puerta queda sin candado.
        add_header Content-Security-Policy $site_csp always;
    }

    # Íconos e imágenes de vista previa: no llevan huella en el nombre, así que
    # no pueden ser `immutable`, pero cambian una vez al año. Unos días de
    # caché ahorran una petición por visita y el peor caso al cambiarlos es una
    # semana de desfase en una miniatura.
    location ~* ^/(?:favicon[\w-]*\.(?:svg|png)|apple-touch-icon\.png|icon-maskable-\d+\.png)$ {
        expires 7d;
    }

    location ^~ /og/ {
        expires 7d;
    }

    # ── El API, por el MISMO ORIGEN y SOLO su prefijo público ────────────
    #
    # El sitio le escribe a dos endpoints propios: el formulario
    # (`/api/public/leads`) y la medición (`/api/public/site-events`). Van por
    # el mismo origen a propósito —la decisión está escrita en
    # `apps/site/src/lead/api.ts`—: sin CORS no hay preflight, y un
    # `sendBeacon` con preflight se pierde justo cuando la página se cierra,
    # que es cuando se dispara el evento que más importa. Además el apex NO
    # entra en `CORS_ORIGINS`, donde ganaría permiso para hablarle a `/auth/*`
    # con cookies sin necesitarlo jamás.
    #
    # La barra final de `proxy_pass` hace el strip del prefijo:
    # `/api/public/leads` → `/public/leads` en el API. Mismo truco que el vhost
    # de la app; se puede usar porque el upstream es un nombre estático.
    location ^~ /api/public/ {
        limit_req zone=site_public_ip burst=60 nodelay;

        # Un lead son ~1 KB de JSON y un beacon bastante menos. 16k deja aire
        # de sobra y convierte cualquier intento de subir algo por acá en un
        # 413 barato, antes de gastar un worker de Nest.
        client_max_body_size 16k;

        proxy_pass http://api:3000/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # De acá sale el presupuesto por IP del API: con `TRUST_PROXY_HOPS=1`,
        # Nest se queda con el ÚLTIMO hop de esta cadena. Sin este header,
        # TODO el sitio compartiría un solo balde y el primer robot lo agota
        # para todos los visitantes.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo DEMÁS bajo `/api/` muere acá. El apex no es una puerta al API:
    # `sellpointy.com/api/auth/login` no existe, y eso es lo que evita que la
    # cookie httpOnly de refresh —host-only, emitida para app.sellpointy.com—
    # tenga una segunda superficie por donde intentarse. Es la misma regla dura
    # que ya se aplicó al quitar `/api/` del ápice de laradoc.com (D1 del
    # proposal vps-multidominio).
    #
    # 404 y no 403: un 403 confirma que ahí hay algo. Responde con la 404 del
    # sitio (por el `error_page` de arriba), que es exactamente lo que ve
    # cualquier dirección inventada.
    location ^~ /api/ {
        return 404;
    }

    # ── Enlaces guardados que hoy llegan a la app ────────────────────────
    #
    # ⚠️ LO QUE SE PIERDE AL ENCENDER ESTE VHOST: hoy el apex redirige TODO a
    # `app.sellpointy.com` (los dos `server` del final de
    # `conf.d/app.sellpointy.com.conf`). Desde el encendido, el apex sirve el
    # sitio y SOLO estas rutas siguen viajando a la app; cualquier otra
    # dirección guardada de `sellpointy.com/…` pasa a dar 404.
    #
    # La lista son los primeros segmentos de `apps/web/src/routes`: las puertas
    # públicas —las que llegan por correo o se teclean de memoria— más las tres
    # pantallas con sesión que alguien pudo marcar en favoritos. Agregar una
    # ruta pública a la app es agregarla también acá.
    #
    # Va como regex porque las regex se evalúan ANTES que el prefijo `/`, así
    # que estas rutas nunca caen en el `try_files` del sitio. Y no chocan con
    # las del sitio, que siempre empiezan por su mercado (`/es-mx/`, `/en-us/`…).
    location ~ ^/(?:login|register|forgot-password|reset-password|verify-email|verify|accept-invitation|onboarding|profile|dashboard)(?:/|$) {
        return 301 https://app.sellpointy.com$request_uri;
    }

    # El sitio: HTML ya armado en disco.
    #
    # `no-cache` NO significa «no guardes», significa «guarda pero pregunta
    # antes de usar»: con ETag, la revalidación normal es un 304 de unos pocos
    # bytes y un cambio de texto se ve al instante, que es justo lo que se
    # necesita en un sitio que cambia por copy y no por código. `expires -1` es
    # la forma de decirlo sin usar `add_header` (ver el gotcha de arriba).
    #
    # `try_files … =404` sin fallback a index.html: esto NO es una SPA. Una
    # dirección que no existe en disco tiene que dar 404 de verdad, no la
    # portada con estado 200 (mismo criterio que los vhosts de laradoc.com y
    # berrinchitosdent.com).
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
