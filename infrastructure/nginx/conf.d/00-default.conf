# default_server — corta el bypass de Cloudflare por IP pelada (gate 9 del
# verify de f0-deploy, cerrado por D2 del proposal vps-multidominio).
#
# El prefijo "00-" garantiza que nginx cargue este archivo antes que los
# vhosts de dominio (el include de nginx.conf es un glob alfabético) para que
# sea efectivamente el default_server. Sin default_server explícito, nginx
# toma el PRIMER server block del glob — hoy accidentalmente serviría
# contenido real a quien pegue directo a la IP.
#
# ssl_reject_handshake (nginx >= 1.19.4; esta imagen corre 1.31.3) rechaza el
# handshake TLS sin necesitar un certificado dummy para el default_server.

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
