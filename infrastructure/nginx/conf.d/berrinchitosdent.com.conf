# Vhost de berrinchitosdent.com — sitio informativo PHP (D4 del proposal
# vps-multidominio, unidad U4). El certificado YA existe en el server
# (tls-bootstrap.sh berrinchitosdent.com www.berrinchitosdent.com, emisión
# confirmada 2026-08-07, expira 2026-11-05) — regla dura de D2: este
# archivo se commitea SOLO después de eso.
#
# Detrás de Cloudflare naranja (D8): cloudflare-realip.inc es obligatorio,
# si no el limit_req/logging vería la IP del edge de CF para TODOS los
# visitantes en vez de la real.

server {
    listen 80;
    server_name berrinchitosdent.com www.berrinchitosdent.com;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name berrinchitosdent.com www.berrinchitosdent.com;

    ssl_certificate     /etc/letsencrypt/live/berrinchitosdent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/berrinchitosdent.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.inc;

    include /etc/nginx/snippets/cloudflare-realip.inc;
    include /etc/nginx/snippets/security-headers.inc;

    root /var/www/sites/berrinchitosdent.com/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Pool propia en php-fpm (D4: aislamiento entre sitios, open_basedir
    # propio) — puerto distinto al de laradoc.com porque php-fpm no puede
    # enrutar por Host header dentro de un mismo listener. try_files ANTES
    # de fastcgi_pass bloquea el exploit clásico de path-info.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php-fpm:9002;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    include /etc/nginx/snippets/php-site.inc;
}
