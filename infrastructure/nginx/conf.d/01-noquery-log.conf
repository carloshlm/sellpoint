# Formato de log `noquery` — compartido por los vhosts de la app (2026-08-26).
#
# Vivía dentro de system.laradoc.com.conf "junto al ÚNICO vhost que lo usa";
# con dos ambientes (app.sellpointy.com y sandbox.sellpointy.com) eso dejó de
# ser cierto, y definir map/log_format dos veces rompe `nginx -t` (duplicado
# en contexto http). Por eso se extrae ANTES de crear los vhosts nuevos.
# El prefijo 01- garantiza que el include glob de conf.d lo cargue antes que
# cualquier vhost que lo referencie.
#
# W4 del verify f1-web-auth: los tokens de un solo uso viajan en query string
# (/verify-email?token=..., /reset-password?token=..., /accept-invitation
# ?token=... — el de invitación vive 7 DÍAS) y el formato `main` de la imagen
# loguea `$request` completo, query incluida. Este formato corta la query en
# los DOS lugares donde el secreto aparece:
#
#   1. La request line: `$request_path` es `$request_uri` sin query (map de
#      abajo). Se usa $request_uri crudo y NO $uri porque $uri es el resultado
#      post-rewrites (en el container web, try_files lo dejaría en
#      /index.html para toda ruta SPA — se perdería QUÉ ruta se pidió).
#   2. El Referer: bajo strict-origin-when-cross-origin las subrequests
#      same-origin (/assets/*.js) mandan la URL completa del documento como
#      Referer — el token aparecería una segunda vez. El map lo recorta solo
#      cuando trae query; sin query pasa intacto.
#
# Tradeoff asumido: las queries de /api/ tampoco se loguean acá (hoy no
# llevan secretos por diseño — los tokens van en el BODY — pero un endpoint
# futuro que filtre por query pierde ese detalle en ESTE log; el container
# de la api tiene su propio log). Falla cerrado: cualquier ruta futura que
# ponga un secreto en la URL nace protegida.

map $request_uri $request_path {
    default              $request_uri;
    ~^(?<ruta>[^?]+)\?   $ruta;
}

map $http_referer $referer_sin_query {
    # Sin Referer: "-" explícito. El map siempre DEFINE la variable, así que
    # el log module ya no aplica su guion de "variable no encontrada" — sin
    # esta línea, un request sin Referer se loguearía como "" en vez de "-".
    ""                       -;
    default                  $http_referer;
    ~^(?<ref_base>[^?]+)\?   $ref_base;
}

log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $request_path $server_protocol" '
                   '$status $body_bytes_sent "$referer_sin_query" '
                   '"$http_user_agent" "$http_x_forwarded_for"';
