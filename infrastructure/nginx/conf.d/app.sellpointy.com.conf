# Vhost de app.sellpointy.com — PRODUCCIÓN (dos ambientes, 2026-08-27).
# Mismo contenido que el vhost de system.laradoc.com salvo el server_name y
# el lineage. El certificado ya existe en el server (tls-bootstrap.sh,
# emisión confirmada 2026-08-27, expira 2026-11-25, SANs: sellpointy.com y
# sandbox.sellpointy.com) — regla dura de D2: este archivo se commitea SOLO
# después de eso.
#
# Ventana de coexistencia: system.laradoc.com sigue sirviendo la app en
# paralelo hasta la fase 7 del plan (301 tras soak). Nunca hay un instante
# sin servicio.
#
# El apex sellpointy.com NO sirve la app: queda reservado para la landing
# futura y mientras tanto redirige 301 a app — mover la app del apex después
# rompería URLs guardadas y PWAs instaladas de clientes reales.
# El formato `noquery` (tokens fuera de los logs) vive en 01-noquery-log.conf.

server {
    listen 80;
    server_name app.sellpointy.com;

    access_log /var/log/nginx/access.log noquery;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.sellpointy.com;

    access_log /var/log/nginx/access.log noquery;

    ssl_certificate     /etc/letsencrypt/live/app.sellpointy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sellpointy.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.inc;

    # app va en gris (sin CF por delante) — estos headers son la ÚNICA capa.
    # Es el origen que lleva la cookie httpOnly de f1-auth.
    include /etc/nginx/snippets/security-headers.inc;

    # CSP PRAGMÁTICA (F6-EDGE-01): la SPA no carga NADA externo (sin CDNs ni
    # fuentes remotas — verificado por grep), así que 'self' cubre todo.
    # unsafe-inline solo en styles (Tailwind runtime); blob: para el PDF del
    # ticket y el worker del escáner. Sin nonces: una CSP estricta rompería
    # la app a cambio de un riesgo que con 3 clientes no paga su renta.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Las rutas de AUTH con rate limit de nginx (F6-EDGE-02) — un location
    # más específico gana al genérico de abajo; el proxy se repite porque
    # nginx no hereda proxy_pass entre siblings.
    location /api/auth/ {
        limit_req zone=auth_ip burst=10 nodelay;
        proxy_pass http://api:3000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API: strip del prefijo /api antes de reenviar a la imagen de la API (D8 de f0).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto del tráfico: la imagen web (nginx interno con SPA fallback).
    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── El APEX: redirect 301 a la app ───────────────────────────────────────
# Cuando exista la landing, estos dos bloques se reemplazan por su vhost.

server {
    listen 80;
    server_name sellpointy.com;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 301 https://app.sellpointy.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sellpointy.com;

    # El apex es un SAN del lineage de app — mismo certificado.
    ssl_certificate     /etc/letsencrypt/live/app.sellpointy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sellpointy.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.inc;

    return 301 https://app.sellpointy.com$request_uri;
}
