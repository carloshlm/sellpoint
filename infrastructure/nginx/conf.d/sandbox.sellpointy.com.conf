# Vhost de sandbox.sellpointy.com — el ambiente de PRUEBAS (2026-08-27).
# Mismo esqueleto que app.sellpointy.com.conf con UNA diferencia de fondo:
# los upstreams viven en OTRO stack de compose (sellpoint-sandbox), alcanzados
# por la red externa compartida `sellpoint-edge-sandbox` con los aliases
# sandbox-web / sandbox-api.
#
# ── Resolución DIFERIDA, no estática (decisión D-B del plan) ─────────────
#
# Un `proxy_pass http://sandbox-api:3000` a secas se resuelve AL CARGAR la
# config: con el sandbox caído o aún no creado, `nginx -t` falla con "host
# not found in upstream" — y ese nginx -t corre en CADA deploy de
# PRODUCCIÓN. El sandbox no puede tener ese poder. Con `resolver` (el DNS
# interno de Docker) + la variable, la resolución ocurre por REQUEST:
# sandbox caído = 502 en este vhost y solo en este vhost.
#
# El `rewrite ... break` reemplaza al strip por URI de proxy_pass: cuando
# proxy_pass lleva variable, nginx ya no puede reescribir el prefijo solo
# (no hay URI en la directiva) — el rewrite hace ese trabajo a mano.
# El certificado es el mismo lineage de app (sandbox es un SAN).

server {
    listen 80;
    server_name sandbox.sellpointy.com;

    access_log /var/log/nginx/access.log noquery;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sandbox.sellpointy.com;

    access_log /var/log/nginx/access.log noquery;

    ssl_certificate     /etc/letsencrypt/live/app.sellpointy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sellpointy.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.inc;
    include /etc/nginx/snippets/security-headers.inc;

    # 127.0.0.11 es el DNS embebido de Docker; valid=30s para que un sandbox
    # recién levantado se vea sin recargar nginx. ipv6=off: la red bridge no
    # tiene AAAA y el intento solo mete latencia.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        # El `set` va ANTES del `rewrite`: `break` DETIENE las directivas del
        # módulo rewrite — y `set` es una de ellas. Al revés, la variable
        # queda vacía y nginx responde 500 "invalid URL prefix" (aprendido en
        # el primer deploy del sandbox, run 33081669665).
        set $sandbox_api http://sandbox-api:3000;
        # Strip de /api a mano (ver docblock): con variable en proxy_pass no
        # hay reescritura implícita del prefijo.
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $sandbox_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $sandbox_web http://sandbox-web:80;
        proxy_pass $sandbox_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
