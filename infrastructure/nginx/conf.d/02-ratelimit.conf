# F6-EDGE-02 — zona de rate limit para las rutas de AUTENTICACIÓN.
#
# Defensa en profundidad DEBAJO del throttler de Nest: si la api se satura,
# nginx corta antes de que el request la toque. Solo /api/auth/* — el resto
# del API lo gobierna el throttler fino de la app (por usuario, no por IP).
#
# 1m de zona ≈ 16k IPs simultáneas — memoria despreciable (LEY de la fase).
# 30r/m con burst 10: un login legítimo hace 1-2 requests; un script de
# fuerza bruta hace cientos. El estado 429 (no el 503 default) para que el
# front lo trate igual que el throttler.
limit_req_zone $binary_remote_addr zone=auth_ip:1m rate=30r/m;
limit_req_status 429;

# Zona propia para POST /auth/refresh (Carlos, 2026-08-31).
#
# El refresh NO es superficie de adivinado: autentica con una cookie httpOnly
# de 256 bits y el reuso ya revoca la familia entera. Pero el bootstrap del
# front lo dispara en CADA carga de página, así que meterlo en `auth_ip`
# (30r/m, burst 10) repetía en el borde el self-DoS que la app ya había
# eximido el 2026-08-14: quince recargas rápidas —el incidente real de
# Carlos— tropezaban en nginx aunque el API ya lo permitiera.
#
# 60r/m con burst 30: las recargas frenéticas de una persona (una petición de
# refresh por carga) caben enteras en el burst; un bot que martilla refresh
# sigue chocando contra el muro y, detrás, contra el throttler global de la
# app (300r/m por IP).
limit_req_zone $binary_remote_addr zone=refresh_ip:1m rate=60r/m;
