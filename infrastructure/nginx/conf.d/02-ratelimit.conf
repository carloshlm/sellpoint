# F6-EDGE-02 — zona de rate limit para las rutas de AUTENTICACIÓN.
#
# Defensa en profundidad DEBAJO del throttler de Nest: si la api se satura,
# nginx corta antes de que el request la toque. Solo /api/auth/* — el resto
# del API lo gobierna el throttler fino de la app (por usuario, no por IP).
#
# 1m de zona ≈ 16k IPs simultáneas — memoria despreciable (LEY de la fase).
# 30r/m con burst 10: un login legítimo hace 1-2 requests; un script de
# fuerza bruta hace cientos. El estado 429 (no el 503 default) para que el
# front lo trate igual que el throttler.
limit_req_zone $binary_remote_addr zone=auth_ip:1m rate=30r/m;
limit_req_status 429;
