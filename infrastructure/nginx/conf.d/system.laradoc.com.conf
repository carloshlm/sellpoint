# Vhost de system.laradoc.com — la app (web + api), mismo contenido que
# laradoc.com.conf (U1) salvo el server_name (D1/D2 del proposal
# vps-multidominio, unidad U3). El certificado ya existe en el server
# (tls-bootstrap.sh, emisión confirmada 2026-08-07, expira 2026-11-05) —
# regla dura de D2: este archivo se commitea SOLO después de eso.
#
# Ventana de coexistencia (D1): laradoc.com sigue sirviendo la app en
# paralelo — el ápice se libera recién en U4. Nunca hubo un instante sin
# servicio: system empezó a proxear en :80 desde el bootstrap http-only.

# W4 del verify f1-web-auth: los tokens de un solo uso viajan en query string
# (/verify-email?token=..., /reset-password?token=..., /accept-invitation
# ?token=... — el de invitación vive 7 DÍAS) y el formato `main` de la imagen
# loguea `$request` completo, query incluida. Este vhost loguea con un formato
# propio que corta la query en los DOS lugares donde el secreto aparece:
#
#   1. La request line: `$request_path` es `$request_uri` sin query (map de
#      abajo). Se usa $request_uri crudo y NO $uri porque $uri es el resultado
#      post-rewrites (en el container web, try_files lo dejaría en
#      /index.html para toda ruta SPA — se perdería QUÉ ruta se pidió).
#   2. El Referer: bajo strict-origin-when-cross-origin las subrequests
#      same-origin (/assets/*.js) mandan la URL completa del documento como
#      Referer — el token aparecería una segunda vez. El map lo recorta solo
#      cuando trae query; sin query pasa intacto.
#
# Tradeoff asumido: las queries de /api/ tampoco se loguean acá (hoy no
# llevan secretos por diseño — los tokens van en el BODY — pero un endpoint
# futuro que filtre por query pierde ese detalle en ESTE log; el container
# de la api tiene su propio log). Falla cerrado: cualquier ruta futura que
# ponga un secreto en la URL nace protegida.
#
# map y log_format son de contexto http (este archivo entra por el include
# glob de conf.d), y quedan acá y no en un archivo aparte para que el formato
# viva junto al ÚNICO vhost que lo usa — los otros vhosts siguen con `main`.

map $request_uri $request_path {
    default              $request_uri;
    ~^(?<ruta>[^?]+)\?   $ruta;
}

map $http_referer $referer_sin_query {
    # Sin Referer: "-" explícito. El map siempre DEFINE la variable, así que
    # el log module ya no aplica su guion de "variable no encontrada" — sin
    # esta línea, un request sin Referer se loguearía como "" en vez de "-".
    ""                       -;
    default                  $http_referer;
    ~^(?<ref_base>[^?]+)\?   $ref_base;
}

log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $request_path $server_protocol" '
                   '$status $body_bytes_sent "$referer_sin_query" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name system.laradoc.com;

    access_log /var/log/nginx/access.log noquery;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name system.laradoc.com;

    access_log /var/log/nginx/access.log noquery;

    ssl_certificate     /etc/letsencrypt/live/system.laradoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/system.laradoc.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.inc;

    # W2 del verify vps-multidominio: system va en gris (sin CF por
    # delante) — estos headers son la ÚNICA capa. Es el origen que llevará
    # la cookie httpOnly de f1-auth.
    include /etc/nginx/snippets/security-headers.inc;

    # API: strip del prefijo /api antes de reenviar a la imagen de la API (D8 de f0).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto del tráfico: la imagen web (nginx interno con SPA fallback).
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
