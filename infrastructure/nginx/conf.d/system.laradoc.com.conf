# Vhost de system.laradoc.com — la app (web + api), mismo contenido que
# laradoc.com.conf (U1) salvo el server_name (D1/D2 del proposal
# vps-multidominio, unidad U3). El certificado ya existe en el server
# (tls-bootstrap.sh, emisión confirmada 2026-08-07, expira 2026-11-05) —
# regla dura de D2: este archivo se commitea SOLO después de eso.
#
# Ventana de coexistencia (D1): laradoc.com sigue sirviendo la app en
# paralelo — el ápice se libera recién en U4. Nunca hubo un instante sin
# servicio: system empezó a proxear en :80 desde el bootstrap http-only.

# El formato `noquery` (tokens fuera de los logs) vive en 01-noquery-log.conf
# desde 2026-08-26: con dos ambientes ya no hay "unico vhost que lo usa" y
# duplicar la directiva rompe nginx -t.

server {
    listen 80;
    server_name system.laradoc.com;

    access_log /var/log/nginx/access.log noquery;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name system.laradoc.com;

    access_log /var/log/nginx/access.log noquery;

    ssl_certificate     /etc/letsencrypt/live/system.laradoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/system.laradoc.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.inc;

    # W2 del verify vps-multidominio: system va en gris (sin CF por
    # delante) — estos headers son la ÚNICA capa. Es el origen que llevará
    # la cookie httpOnly de f1-auth.
    include /etc/nginx/snippets/security-headers.inc;

    # API: strip del prefijo /api antes de reenviar a la imagen de la API (D8 de f0).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto del tráfico: la imagen web (nginx interno con SPA fallback).
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
