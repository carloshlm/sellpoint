# system.laradoc.com — SOLO redirect al dominio oficial (2026-08-27, fase 7
# del plan de dos ambientes, adelantada por decisión de Carlos: la plataforma
# está en pruebas y él es el único usuario, no hay soak que esperar).
#
# `return 301` y no un index.html con meta-refresh: cubre TODAS las rutas
# preservando path y query — un link de correo viejo (verify-email,
# accept-invitation con token de 7 días) aterriza intacto en el dominio
# nuevo; el fragment `#token=` lo conserva el navegador por su cuenta.
#
# El certificado y el webroot ACME se CONSERVAN a propósito: sin el bloque
# :443 el redirect https no funcionaría, y sin acme.inc el lineage dejaría
# de renovar. El lineage de system nunca se borra.

server {
    listen 80;
    server_name system.laradoc.com;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 301 https://app.sellpointy.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name system.laradoc.com;

    ssl_certificate     /etc/letsencrypt/live/system.laradoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/system.laradoc.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.inc;

    return 301 https://app.sellpointy.com$request_uri;
}
