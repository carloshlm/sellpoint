# Vhost de laradoc.com — sitio informativo PHP (D1/D4 del proposal
# vps-multidominio, unidad U4: PASO FINAL de la migración). La app ya vive
# completa en system.laradoc.com desde U3 — este swap libera el ápice.
#
# ⚠️ Regla dura de D1: `laradoc.com/api/` se ELIMINA sin redirect (ya no hay
# `location /api/` acá). Si el ápice siguiera proxeando al API, la cookie de
# refresh de f1-auth (httpOnly, host-only, sin `Domain`) podría terminar
# compartida entre el ápice y el sitio PHP — la superficie más débil del
# server (forms, código sin tests, deploy externo). Corte limpio.
#
# El cert de laradoc.com se REUSA (ya existía desde f0-deploy, cubre
# laradoc.com + www.laradoc.com) — nada que emitir de nuevo acá.
#
# Rollback si algo falla: `cp` de la versión anterior de este archivo
# (proxy a la app, en git) + `nginx -t && nginx -s reload`. Segundos, sin
# tocar contenedores. system.laradoc.com nunca se entera — la app nunca
# deja de estar accesible ahí.

server {
    listen 80;
    server_name laradoc.com www.laradoc.com;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name laradoc.com www.laradoc.com;

    ssl_certificate     /etc/letsencrypt/live/laradoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laradoc.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.inc;

    include /etc/nginx/snippets/cloudflare-realip.inc;
    include /etc/nginx/snippets/security-headers.inc;

    root /var/www/sites/laradoc.com/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Pool propia en php-fpm (D4: aislamiento entre sitios, open_basedir
    # propio) — puerto distinto al de berrinchitosdent.com porque php-fpm
    # no puede enrutar por Host header dentro de un mismo listener.
    # try_files ANTES de fastcgi_pass bloquea el exploit clásico de
    # path-info.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php-fpm:9001;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    include /etc/nginx/snippets/php-site.inc;
}
