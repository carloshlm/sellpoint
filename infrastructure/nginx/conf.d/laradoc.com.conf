# Vhost de laradoc.com — contenido EQUIVALENTE al with-tls.conf de f0-deploy,
# refactorizado a conf.d/ + snippets/ (D2 del proposal vps-multidominio).
#
# Sigue sirviendo la app (web + api) en el ápice: U1 es solo el refactor de
# estructura, la migración de la app a system.laradoc.com es U3 (bloqueada
# por M1 — DNS de system.laradoc.com todavía en naranja).

server {
    listen 80;
    server_name laradoc.com www.laradoc.com;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name laradoc.com www.laradoc.com;

    ssl_certificate     /etc/letsencrypt/live/laradoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laradoc.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.inc;

    # API: strip del prefijo /api antes de reenviar a la imagen de la API (D8 de f0).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto del tráfico: la imagen web (nginx interno con SPA fallback).
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
