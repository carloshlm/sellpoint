# Vhost de website-sandbox.sellpointy.com — el SITIO en PRUEBAS
# (F11-SITE-INFRA-03).
#
# ⚠️ ESTE ARCHIVO NO ESTÁ ENCENDIDO, y a diferencia del apex TODAVÍA NO PUEDE
# ESTARLO: le faltan dos cosas que solo el dueño puede hacer.
#
#   1. Un registro DNS `website-sandbox.sellpointy.com` apuntando al server.
#   2. Reemitir el certificado agregando ese nombre como SAN. Hoy el lineage
#      `/etc/letsencrypt/live/app.sellpointy.com/` cubre app.sellpointy.com,
#      sellpointy.com y sandbox.sellpointy.com — NO este nombre. Mientras no
#      se reemita, cualquier navegador que entre acá verá un error de
#      certificado ANTES de ver una sola letra del sitio.
#
# Los dos requisitos, con el comando exacto, están en `pending/README.md`.
#
# Por qué el nombre es `website-sandbox` y no `sandbox`: `sandbox.sellpointy.com`
# ya es el sandbox de la APLICACIÓN (`conf.d/sandbox.sellpointy.com.conf`) y no
# se toca. El sitio necesita un nombre propio.
#
# Es copia del vhost del apex (`pending/sellpointy.com.conf`) con TRES
# diferencias, y ninguna más — cualquier cambio en aquel se replica acá:
#   · `root` en `/var/www/sites/website-sandbox.sellpointy.com/public`;
#   · `/api/public/` va al API del SANDBOX, con resolución diferida (el mismo
#     patrón de `conf.d/sandbox.sellpointy.com.conf`, explicado abajo);
#   · `X-Robots-Tag: noindex, nofollow`, para que un ensayo no aparezca en
#     Google compitiendo con el sitio de verdad.
#
# ⚠️ QUÉ PROTECCIÓN TIENE HOY EL SANDBOX DE LA APP: ninguna, además de no
# estar indexado. Se leyó `conf.d/sandbox.sellpointy.com.conf` entero: no hay
# `auth_basic`, ni `allow`/`deny` por IP, ni nada equivalente — está abierto a
# internet y lo único que lo separa de producción son sus credenciales y su
# base de datos. Este vhost hereda exactamente esa postura. Si el sitio en
# pruebas va a llevar precios o textos que no deben verse antes de tiempo, la
# protección hay que AGREGARLA (ver `pending/README.md`).

# La zona de rate limit, en el mismo archivo y por el mismo motivo que en el
# apex (ver el comentario allá). Nombre DISTINTO al del apex a propósito: dos
# `limit_req_zone` con el mismo nombre hacen fallar `nginx -t`, y los dos
# archivos pueden terminar en `conf.d/` a la vez.
limit_req_zone $binary_remote_addr zone=site_sandbox_public_ip:1m rate=120r/m;

server {
    listen 80;
    server_name website-sandbox.sellpointy.com;

    access_log /var/log/nginx/access.log noquery;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name website-sandbox.sellpointy.com;

    access_log /var/log/nginx/access.log noquery;

    # El lineage de la app, que es donde va a vivir el SAN nuevo cuando se
    # reemita (`tls-bootstrap.sh` agrega dominios extra al MISMO lineage; ver
    # `pending/README.md`). Se apunta acá y no a un lineage propio
    # inexistente a propósito: un `ssl_certificate` que no existe hace fallar
    # `nginx -t`, y ese `nginx -t` corre en CADA deploy de producción — un
    # vhost de pruebas no puede tener el poder de abortar un deploy.
    ssl_certificate     /etc/letsencrypt/live/app.sellpointy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sellpointy.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.inc;
    include /etc/nginx/snippets/security-headers.inc;

    # Un ensayo no se indexa. Va con `always` para que también salga en las
    # respuestas de error, y se repite en el `location` de `/_astro/` porque
    # allá hay un `add_header` que borra la herencia (ver el gotcha abajo).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # La MISMA CSP del apex, sin aflojar nada: si el sandbox tuviera una CSP
    # más laxa, dejaría de servir para descubrir que la del apex rompe algo.
    # El hash es el del mismo guion del tema — `site-csp-hash.sh` valida los
    # dos vhosts contra el HTML construido.
    set $site_csp "default-src 'none'; script-src 'self' 'sha256-gfux6XwrryKoWtEUI41qNc2pOgLjoSzTu4EnLofFdYU='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'";
    add_header Content-Security-Policy $site_csp always;

    # Ruta DENTRO del contenedor: en el server los archivos están en
    # `/opt/sites/website-sandbox.sellpointy.com/…` y el compose monta
    # `/opt/sites` en `/var/www/sites` (ver el vhost del apex).
    root /var/www/sites/website-sandbox.sellpointy.com/public;
    index index.html;

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml;

    # `127.0.0.11` es el DNS embebido de Docker; `valid=30s` para que un
    # sandbox recién levantado se vea sin recargar nginx, e `ipv6=off` porque
    # la red bridge no tiene AAAA y el intento solo mete latencia. Es lo que
    # habilita la resolución diferida del `proxy_pass` de más abajo.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Mismo gotcha de `add_header` que en el apex: un `add_header` dentro de un
    # `location` borra TODOS los del `server`. Se re-incluyen los snippets y se
    # repiten la CSP y el X-Robots-Tag.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.inc;
        add_header Content-Security-Policy $site_csp always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* ^/(?:favicon[\w-]*\.(?:svg|png)|apple-touch-icon\.png|icon-maskable-\d+\.png)$ {
        expires 7d;
    }

    location ^~ /og/ {
        expires 7d;
    }

    # ── El API del SANDBOX, solo su prefijo público ──────────────────────
    #
    # Resolución DIFERIDA, igual que `conf.d/sandbox.sellpointy.com.conf`: un
    # `proxy_pass http://sandbox-api:3000` a secas se resuelve AL CARGAR la
    # config, así que con el sandbox caído `nginx -t` falla con "host not found
    # in upstream" — y ese `nginx -t` corre en cada deploy de PRODUCCIÓN. Con
    # `resolver` + variable, la resolución ocurre por request: sandbox caído =
    # 502 acá y solo acá.
    #
    # ⚠️ El `set` va ANTES del `rewrite`: `break` DETIENE las directivas del
    # módulo rewrite, y `set` es una de ellas. Al revés, la variable queda
    # vacía y nginx responde 500 "invalid URL prefix" (aprendido en el primer
    # deploy del sandbox de la app, run 33081669665).
    #
    # El `rewrite` reemplaza al strip por URI de `proxy_pass`: con variable en
    # `proxy_pass` nginx ya no puede reescribir el prefijo solo.
    location ^~ /api/public/ {
        limit_req zone=site_sandbox_public_ip burst=60 nodelay;
        client_max_body_size 16k;

        set $sandbox_site_api http://sandbox-api:3000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $sandbox_site_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás bajo `/api/` muere acá — misma regla dura que el apex.
    location ^~ /api/ {
        return 404;
    }

    # Las rutas guardadas de la app van al sandbox de la APP, no a producción:
    # un ensayo que te manda a producción es una trampa esperando.
    location ~ ^/(?:login|register|forgot-password|reset-password|verify-email|verify|accept-invitation|onboarding|profile|dashboard)(?:/|$) {
        return 301 https://sandbox.sellpointy.com$request_uri;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
