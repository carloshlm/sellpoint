# Etapa 2 de TLS (D7 del proposal f0-deploy) — 443 + redirect desde 80.
#
# Se activa DESPUÉS de que la emisión real de Let's Encrypt (sin --dry-run)
# terminó OK: copiar este archivo a /opt/sellpoint/nginx/default.conf y
# `docker compose up -d --force-recreate nginx-edge`.
#
# Sigue sirviendo /.well-known/acme-challenge/ por :80 (sin redirect) porque
# la renovación automática (cron del host, D7) también usa HTTP-01 sobre :80.

server {
    listen 80;
    server_name laradoc.com www.laradoc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás por :80 se redirige a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name laradoc.com www.laradoc.com;

    ssl_certificate     /etc/letsencrypt/live/laradoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laradoc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # API: strip del prefijo /api antes de reenviar a la imagen de la API (D8).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto del tráfico: la imagen web (nginx interno con SPA fallback).
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
