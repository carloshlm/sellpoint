# Etapa 1 de TLS para berrinchitosdent.com (D2 del proposal vps-multidominio,
# unidad U4). Solo :80 — todavía no hay certificado, así que no puede existir
# un bloque :443 (ssl_certificate apuntando a un archivo inexistente tira
# "nginx -t" abajo).
#
# A diferencia de system.laradoc.com (U3), acá no hay servicio previo que
# preservar: es un dominio nuevo, cero tráfico real (M2/M3 del proposal ya
# resueltos por Carlos: DNS apuntado al VPS en naranja, contenido placeholder
# en /opt/sites/berrinchitosdent.com/public/). El :80 solo atiende el
# challenge ACME para AMBOS nombres (ápice y www, D3: mismo lineage, el www
# es un SAN del mismo cert) — el resto 404 hasta que exista el vhost TLS
# definitivo.
#
# ⚠️ Dominio detrás de Cloudflare naranja (D8): si "Always Use HTTPS" está
# activo en esta zona de CF, el challenge HTTP-01 nunca llega al origen (CF
# lo redirige a 301 antes) y el --dry-run de tls-bootstrap.sh falla. Eso NO
# se soluciona desde este archivo — lo tiene que apagar Carlos en el
# dashboard de CF para esta zona.
#
# Flujo: infrastructure/scripts/tls-bootstrap.sh berrinchitosdent.com \
#   www.berrinchitosdent.com
# copia este archivo a conf.d/berrinchitosdent.com.conf en el server ->
# nginx -t && reload -> certbot --dry-run -> emisión real. Recién ahí se
# reemplaza este archivo por el vhost TLS definitivo
# (infrastructure/nginx/conf.d/berrinchitosdent.com.conf).

server {
    listen 80;
    server_name berrinchitosdent.com www.berrinchitosdent.com;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 404;
    }
}
