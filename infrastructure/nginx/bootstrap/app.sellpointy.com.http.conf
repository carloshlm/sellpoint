# Etapa 1 de TLS para sellpointy.com (dos ambientes, 2026-08-26). Solo :80 —
# todavía no hay certificado, así que no puede existir un bloque :443
# (ssl_certificate apuntando a un archivo inexistente tira "nginx -t" abajo).
#
# UN solo lineage con app como primario y el apex + sandbox como SANs:
#   tls-bootstrap.sh app.sellpointy.com sellpointy.com sandbox.sellpointy.com
#
# A diferencia del bootstrap de system, acá NO se proxea la app por :80: no
# hay ventana de coexistencia que servir (la app sigue viva en
# system.laradoc.com durante toda la transición). Solo el webroot de ACME y
# un 404 para lo demás.
#
# Flujo: tls-bootstrap.sh copia este archivo a conf.d/ en el server →
# nginx -t && reload → certbot --dry-run → emisión real. Recién ahí se
# commitean los vhosts TLS definitivos (app.sellpointy.com.conf y
# sandbox.sellpointy.com.conf) — regla dura D2.

server {
    listen 80;
    server_name app.sellpointy.com sellpointy.com sandbox.sellpointy.com;

    include /etc/nginx/snippets/acme.inc;

    location / {
        return 404;
    }
}
