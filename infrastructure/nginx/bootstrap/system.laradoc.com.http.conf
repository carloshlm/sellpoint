# Etapa 1 de TLS para system.laradoc.com (D2/D1 del proposal vps-multidominio,
# unidad U3). Solo :80 — todavía no hay certificado, así que no puede existir
# un bloque :443 (ssl_certificate apuntando a un archivo inexistente tira
# "nginx -t" abajo).
#
# Ya proxea la app en :80 (sin redirect a https, que todavía no funciona):
# esto es intencional — D1 dice que system.laradoc.com empieza a servir la
# app ANTES de que exista el cert, así arranca la ventana de coexistencia lo
# antes posible. El ápice laradoc.com sigue sirviendo la app en paralelo,
# sin tocarse en esta unidad.
#
# Flujo: infrastructure/scripts/tls-bootstrap.sh copia este archivo a
# conf.d/system.laradoc.com.conf en el server → nginx -t && reload →
# certbot --dry-run → emisión real. Recién ahí se reemplaza este archivo por
# el vhost TLS definitivo (infrastructure/nginx/conf.d/system.laradoc.com.conf,
# contenido equivalente a laradoc.com.conf).

server {
    listen 80;
    server_name system.laradoc.com;

    include /etc/nginx/snippets/acme.inc;

    # API: strip del prefijo /api antes de reenviar a la imagen de la API (D8 de f0).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto del tráfico: la imagen web (nginx interno con SPA fallback).
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
