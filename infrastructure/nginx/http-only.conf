# Etapa 1 de TLS (D7 del proposal f0-deploy) — SOLO puerto 80.
#
# Objetivo único: servir /.well-known/acme-challenge/ para que certbot pueda
# emitir el certificado con HTTP-01. Mientras este archivo está activo como
# default.conf, todavía NO hay certificado, así que nginx no puede escuchar
# en 443 (fallaría al arrancar si `ssl_certificate` apunta a un archivo que
# no existe todavía).
#
# Se activa copiando este archivo a /opt/sellpoint/nginx/default.conf
# ANTES de la primera emisión de certificado (docker compose run --rm certbot).
# Después de emitir el cert, se reemplaza por with-tls.conf (etapa 2).

server {
    listen 80;
    server_name laradoc.com www.laradoc.com;

    # ACME challenge — debe responder directo desde el webroot compartido con certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API: strip del prefijo /api antes de reenviar a la imagen de la API (D8).
    # La barra final en proxy_pass elimina el prefijo /api/ del path reenviado.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto del tráfico: la imagen web (nginx interno con SPA fallback).
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
