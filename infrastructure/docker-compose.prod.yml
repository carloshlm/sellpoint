# Compose de producción — corre en el server como usuario `deploy`.
# Ubicación real en el server: /opt/sellpoint/docker-compose.prod.yml
#
# Todo vive en la red interna `sellpoint`. El ÚNICO servicio con puertos
# publicados es nginx-edge (80/443): postgres y redis NO llevan `ports:`
# a propósito — Docker escribe en la cadena DOCKER-USER/nat y saltea ufw,
# así que publicar 5432/6379 los expondría a internet aunque ufw diga
# que están cerrados (gotcha documentado en el proposal, D4).
name: sellpoint

services:
  nginx-edge:
    image: nginx:alpine
    container_name: sellpoint-nginx-edge
    restart: unless-stopped
    # Gobierno de recursos (D5 del proposal vps-multidominio): topes de
    # cgroup, NO reservas — sobre-suscribir la suma por encima de la RAM
    # física es correcto, lo que se compra es que ningún container solo
    # pueda tumbar el host. Keys top-level (mem_limit/cpu_shares), NUNCA
    # `deploy.resources` — ese bloque se ignora en Compose v2 fuera de Swarm.
    mem_limit: 48M
    cpu_shares: 512
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # conf.d/ y snippets/ SÍ se versionan (D2 del proposal vps-multidominio):
      # un archivo por sitio + snippets compartidos. El deploy hace scp de
      # ambos directorios completos y valida con `nginx -t` antes de
      # `nginx -s reload` — NUNCA --force-recreate para cambios de config
      # (un vhost roto no debe poder tumbar los otros sitios).
      # bootstrap/ (etapa 1 de TLS por dominio nuevo) NO se monta ni se
      # versiona acá — ver infrastructure/nginx/bootstrap/README.md.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
      # Sitios PHP de los ápices (D4, unidad U4): MISMA ruta que en
      # php-fpm (/var/www/sites) — gotcha documentado ahí: nginx manda
      # SCRIPT_FILENAME y php-fpm lo resuelve en SU PROPIO filesystem, rutas
      # distintas = "File not found" eterno. :ro en ambos lados.
      - /opt/sites:/var/www/sites:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
      php-fpm:
        condition: service_started
    networks:
      - sellpoint

  web:
    image: ghcr.io/carloshlm/sellpoint-web:${IMAGE_TAG}
    container_name: sellpoint-web
    restart: unless-stopped
    mem_limit: 24M
    cpu_shares: 256
    networks:
      - sellpoint

  api:
    image: ghcr.io/carloshlm/sellpoint-api:${IMAGE_TAG}
    container_name: sellpoint-api
    restart: unless-stopped
    # 512M: 256 de heap (NODE_OPTIONS en .env) + young gen + buffers nativos +
    # argon2id (memoryCost=19456, contrato con f1-auth vía R2 del proposal).
    # memswap_limit = mem_limit deshabilita swap: un Node en swap thrashing
    # es un timeout de 30s sin evidencia; preferimos OOM-kill diagnosticable.
    mem_limit: 512M
    memswap_limit: 512M
    cpu_shares: 1024
    env_file:
      - /opt/sellpoint/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sellpoint

  postgres:
    image: postgres:16-alpine
    container_name: sellpoint-postgres
    restart: unless-stopped
    # Bind EXPLÍCITO a 127.0.0.1: el puerto queda accesible solo desde el
    # localhost del server, NUNCA desde internet. Es lo que habilita
    # inspeccionar la DB con un cliente gráfico a través de un túnel SSH
    # (el túnel entra por SSH y de ahí sale a este localhost).
    # ⚠️ Escribir "5432:5432" a secas publicaría en 0.0.0.0 — la DB entera
    # expuesta al mundo, y ufw NO la protegería: Docker inserta sus reglas
    # DNAT antes de la cadena de ufw. El prefijo 127.0.0.1 no es opcional.
    ports:
      - "127.0.0.1:5432:5432"
    # Tuning en `command:` (visible en git, sin postgresql.conf que mantener
    # sincronizado). synchronous_commit NO se toca — queda en `on` (D5).
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=128MB
    mem_limit: 320M
    cpu_shares: 1024
    env_file:
      - /opt/sellpoint/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sellpoint

  redis:
    image: redis:7-alpine
    container_name: sellpoint-redis
    restart: unless-stopped
    # maxmemory + volatile-ttl: solo evicta claves CON TTL. Los contadores de
    # throttle tienen TTL y son los primeros en caer; perm-epoch:* (f1-auth,
    # D8) se escribe SIN TTL y queda inevictable por construcción — jamás
    # allkeys-lru, eso lo haría evictable. --appendonly yes se mantiene:
    # perder el epoch en un restart re-validaría tokens ya revocados.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    mem_limit: 96M
    memswap_limit: 96M
    cpu_shares: 512
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sellpoint

  # Runtime PHP compartido de los sitios informativos de los ápices (D4 del
  # proposal vps-multidominio, unidad U4). Imagen PINEADA por tag+digest
  # (nunca `latest`): 8.3-fpm-alpine tiene soporte de seguridad hasta 2027.
  # Sin healthcheck a propósito: la imagen no trae cgi-fcgi y un check que
  # solo verifica que el binario existe es teatro — si php-fpm está caído,
  # nginx devuelve 502 (visible e inequívoco).
  php-fpm:
    image: php:8.3-fpm-alpine@sha256:bf90236449d333cef008b1f01c72a3d4f11a6470a74629665e4c6b6158f03fc8
    container_name: sellpoint-php-fpm
    restart: unless-stopped
    # 160M: 5 children x ~25 MB (pm=ondemand, cero children en idle — solo
    # el master, ~6 MB). cpus (cap DURO, no cpu_shares/peso): php-fpm es el
    # vecino menos confiable de este server (código sin tests, deploy
    # externo a este pipeline) — un loop infinito en un sitio no debe poder
    # robarle CPU a la api bajo contención (D5).
    mem_limit: 160M
    cpus: 0.5
    volumes:
      # Misma ruta que en nginx-edge — ver el comentario ahí (gotcha de
      # SCRIPT_FILENAME). :ro es hardening: un webshell no puede escribirse
      # a sí mismo en disco.
      - /opt/sites:/var/www/sites:ro
      - ./php-fpm/conf.d:/usr/local/etc/php/conf.d:ro
      # Reemplaza TODO /usr/local/etc/php-fpm.d/ — el pool "www" default de
      # la imagen NO existe, solo corren las dos pools de acá (D4: dos
      # pools, cada una con su open_basedir propio).
      - ./php-fpm/pool.d:/usr/local/etc/php-fpm.d:ro
    networks:
      - sellpoint

  # One-shot: `docker compose run --rm migrate` — nunca se levanta con `up -d`.
  migrate:
    image: ghcr.io/carloshlm/sellpoint-migrate:${IMAGE_TAG}
    container_name: sellpoint-migrate
    env_file:
      - /opt/sellpoint/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - sellpoint

  # One-shot: emisión/renovación de certificados (`docker compose run --rm certbot ...`).
  certbot:
    image: certbot/certbot
    container_name: sellpoint-certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    profiles:
      - tools

networks:
  sellpoint:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_webroot:
  letsencrypt:
