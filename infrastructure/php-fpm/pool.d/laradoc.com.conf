; Pool de php-fpm para laradoc.com (D4 del proposal vps-multidominio, U4).
; Montado (junto con berrinchitosdent.com.conf) reemplazando por completo
; /usr/local/etc/php-fpm.d/ — así el pool "www" default de la imagen
; oficial NO existe: solo corren estas dos pools, cada una con su propio
; aislamiento.
;
; listen=9001 (TCP interno, red `sellpoint` de compose, sin publicar puerto
; al host): php-fpm no puede enrutar por Host header dentro de un mismo
; listener, así que cada sitio necesita su propio puerto — nginx lo elige
; en el `fastcgi_pass` del vhost correspondiente (conf.d/laradoc.com.conf).

[laradoc.com]
user = www-data
group = www-data
listen = 9001

; Aislamiento entre sitios (D4/R5): open_basedir limita este pool a SU
; propio document root + /tmp. Un LFI en berrinchitosdent.com no puede leer
; nada de acá, aunque compartan runtime y el mismo mount :ro.
php_admin_value[open_basedir] = /var/www/sites/laradoc.com/public:/tmp
chdir = /var/www/sites/laradoc.com/public

; ondemand = cero children en idle (solo el master del container, ~6 MB) —
; la razón por la que php-fpm entra en el presupuesto de RAM del server.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

; stdout/stderr de los workers al log del container (docker logs), no a un
; archivo dentro del mount :ro (que ni se podría escribir).
catch_workers_output = yes
decorate_workers_output = no
