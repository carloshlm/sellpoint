; Pool de php-fpm para berrinchitosdent.com (D4 del proposal
; vps-multidominio, U4). Mismo patrón que laradoc.com.conf — ver los
; comentarios de ese archivo para el razonamiento completo (pools separadas,
; aislamiento, ondemand).

[berrinchitosdent.com]
user = www-data
group = www-data
listen = 9002

php_admin_value[open_basedir] = /var/www/sites/berrinchitosdent.com/public:/tmp
chdir = /var/www/sites/berrinchitosdent.com/public

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
