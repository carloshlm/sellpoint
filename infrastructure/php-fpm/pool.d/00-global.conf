; Override de [global] (D4 del proposal vps-multidominio, U4).
;
; ⚠️ GOTCHA descubierto en este batch: montar este directorio ENTERO sobre
; /usr/local/etc/php-fpm.d/ (para que NO exista el pool "www" default de la
; imagen — D4 exige exactamente 2 pools) también se lleva puestos
; docker.conf y zz-docker.conf, que son los archivos de la imagen oficial
; que ponen `daemonize = no`. Sin ellos, `daemonize` vuelve a su default
; (yes): el master de php-fpm hace fork a background apenas arranca y el
; proceso foreground que Docker está trackeando como PID del container sale
; con exit 0 casi al instante — el container se "completa" en vez de quedar
; corriendo, sin loguear nada (el fork ocurre antes de cualquier mensaje de
; arranque). Verificado en vivo contra el server durante U4: con este
; archivo el container queda corriendo; sin él, `docker run` termina en
; menos de 1s con exit 0 y cero logs.
;
; error_log a stderr: mismo motivo que docker.conf de la imagen oficial —
; php-fpm cierra stdout al arrancar (bug conocido, bugs.php.net/bug.php?id=73886),
; así que el log del master va a fd/2, no fd/1.

[global]
daemonize = no
error_log = /proc/self/fd/2
