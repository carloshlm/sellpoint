; Hardening global de php.ini para el container php-fpm compartido (D4 del
; proposal vps-multidominio, unidad U4). Aplica a AMBAS pools por igual —
; el open_basedir (por sitio) vive en pool.d/, no acá, porque es lo único
; que necesita ser distinto entre laradoc.com y berrinchitosdent.com.
;
; Montado como :ro en /usr/local/etc/php/conf.d/99-hardening.ini — la imagen
; oficial php:8.3-fpm-alpine escanea ese directorio al arrancar
; (--with-config-file-scan-dir), no hace falta reemplazar php.ini entero.

; Bloquea el exploit clásico de path-info (junto con try_files =404 en
; nginx, snippets/php-site.inc + el location de cada vhost).
cgi.fix_pathinfo = 0

; Estos sitios NO reciben archivos: apagar file_uploads elimina la CLASE
; entera de vulnerabilidad de subida de webshell, no la mitiga.
; upload_max_filesize=0 es cinturón-y-tirantes (con file_uploads=Off ya no
; hay uploads posibles de todos modos).
file_uploads = Off
upload_max_filesize = 0
post_max_size = 1M

; Si algo lograra ejecutar código igual, que no pueda invocar al SO.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,dl,pcntl_exec

; Fingerprinting: sin X-Powered-By.
expose_php = Off

; Errores nunca al cliente (fugarían paths); sí al log de Docker (stderr),
; para poder diagnosticar sin exponer nada.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
