; Extensiones compartidas de la imagen php-fpm propia (php-fpm.Dockerfile).
;
; ¿Por qué acá y no en la imagen? docker-php-ext-install deja su .ini en el
; /usr/local/etc/php/conf.d DE LA IMAGEN — pero el compose monta ESTE
; directorio encima (bind :ro del hardening D4), tapándolo. La extensión
; quedaba compilada pero nunca cargada (php -m sin pdo_pgsql, descubierto
; 2026-08-17). Todo lo que la imagen "enable-ee" tiene que re-declararse acá.
extension=pdo_pgsql
