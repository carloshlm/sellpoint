# W4 del verify f1-web-auth: nginx-edge proxea a este container la URI
# ORIGINAL completa (`proxy_pass http://web:80;` sin parte de URI no reescribe
# nada), así que `GET /verify-email?token=SECRETO` llegaría también a ESTE
# access log con el formato `main` de la imagen. Mismo remedio que en el
# vhost del edge (system.laradoc.com.conf): request line y Referer sin query.
#
# $request_uri crudo y NO $uri a propósito: el try_files de abajo reescribe
# $uri a /index.html para toda ruta SPA — con $uri el log diría "GET
# /index.html" siempre y se perdería qué ruta se pidió.

map $request_uri $request_path {
    default              $request_uri;
    ~^(?<ruta>[^?]+)\?   $ruta;
}

map $http_referer $referer_sin_query {
    # Sin Referer: "-" explícito. El map siempre DEFINE la variable, así que
    # el log module ya no aplica su guion de "variable no encontrada" — sin
    # esta línea, un request sin Referer se loguearía como "" en vez de "-".
    ""                       -;
    default                  $http_referer;
    ~^(?<ref_base>[^?]+)\?   $ref_base;
}

log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $request_path $server_protocol" '
                   '$status $body_bytes_sent "$referer_sin_query" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.log noquery;

  # SPA: toda ruta desconocida cae en index.html (TanStack Router resuelve)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache agresivo para assets con hash en el nombre
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
