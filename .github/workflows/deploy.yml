# Deploy: push a main = UN pipeline que valida una vez, construye una vez y
# despliega SANDBOX y luego PRODUCCIÓN (unificado el 2026-09-10; antes había
# dos workflows gemelos —main y develop— que repetían los mismos 16 minutos
# de checks e imágenes para el mismo sha, y obligaban a pushear dos ramas).
#
# checks → build-push (3 imágenes a GHCR) → deploy-sandbox (ssh, migrate,
# up -d, smoke) → deploy (producción, ssh, migrate, up -d, smoke con rollback
# automático por reescritura de IMAGE_TAG, D10).
#
# El sandbox es el GATE de producción: si su migración o su smoke fallan,
# producción no arranca. Ya no hay branch develop ni gate manual.
#
# Secrets asumidos (M3 del proposal, los carga Carlos a mano):
#   DEPLOY_SSH_KEY  — privada de ~/.ssh/sellpoint_ci (autoriza SOLO a `deploy`)
#   DEPLOY_HOST     — IP o dominio del server
#   DEPLOY_USER     — deploy
name: Deploy

on:
  push:
    branches: [main]
    # Solo documentación no despliega (Carlos, 2026-09-04): un .md no lo lee
    # ninguna prueba ni ningún build, y correr 7 minutos de suites para
    # validarlo es tiempo de runner tirado. Si el push mezcla docs con código,
    # GitHub evalúa el conjunto y corre completo. `workflow_dispatch` sigue
    # disponible para forzar un deploy a mano.
    paths-ignore:
      - "**.md"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # `latest` se etiqueta aquí, ANTES del gate del sandbox: es informativo —
  # ningún deploy lo usa, los dos stacks arrancan por el tag del sha.
  #
  # F6-RELEASE-01 — `provenance: false` y `sbom: false` en los tres builds:
  # por defecto buildx empuja, además de la imagen, un índice y una
  # atestación de provenance → TRES versiones por paquete y por deploy en
  # GHCR (así llegó `sellpoint-api` a 1,446 versiones con una retención que
  # borraba 100 por corrida). Nadie verifica esas atestaciones aquí; una
  # imagen por deploy es lo que la retención de `ghcr-retention.yml` cuenta.
  build-push:
    name: build y push imagenes a GHCR
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: build y push api (runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          target: runtime
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/carloshlm/sellpoint-api:latest
            ghcr.io/carloshlm/sellpoint-api:${{ github.sha }}
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,mode=max,scope=api-runtime

      - name: build y push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          target: migrate
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/carloshlm/sellpoint-migrate:latest
            ghcr.io/carloshlm/sellpoint-migrate:${{ github.sha }}
          cache-from: type=gha,scope=api-migrate
          cache-to: type=gha,mode=max,scope=api-migrate

      - name: build y push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: true
          provenance: false
          sbom: false
          # URL relativa: web y api quedan detrás del mismo origen nginx-edge
          # (D8 del proposal). El default local del ARG en el Dockerfile no
          # se toca — este override es SOLO de este workflow.
          build-args: |
            VITE_API_URL=/api
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          tags: |
            ghcr.io/carloshlm/sellpoint-web:latest
            ghcr.io/carloshlm/sellpoint-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # F6-SUPPLY-02: escaneo de vulnerabilidades INFORMATIVO (continue-on-error:
  # con 3 clientes, un gate duro de CVEs frena más de lo que protege — se
  # endurece cuando haya más que perder). Solo CRITICAL, solo la api (la web
  # es nginx sirviendo estáticos). Corre en GitHub: cero recursos del server.
  trivy:
    name: escaneo trivy (informativo)
    needs: build-push
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    steps:
      # Trivy pullea la imagen del registry: necesita la misma sesión que
      # cualquier docker pull contra GHCR.
      - name: login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: escanear la imagen api
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/carloshlm/sellpoint-api:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # El MISMO script curtido de producción con overrides de ambiente: destino
  # /opt/sellpoint-sandbox, compose propio, SMOKE_DOMAIN propio y WITH_EDGE=0
  # (el sandbox no tiene nginx ni php-fpm — su tráfico entra por el edge de
  # producción vía la red compartida, así que el smoke ejercita la cadena
  # completa). No se copian configs de nginx/php-fpm: pertenecen a producción.
  deploy-sandbox:
    name: deploy sandbox via ssh + smoke test
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configurar ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: copiar compose y script al server
        run: |
          # mkdir COMO deploy antes de cualquier bind-mount (R9): si Docker
          # crea el directorio, queda owner root.
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /opt/sellpoint-sandbox/scripts"
          scp -i ~/.ssh/deploy_key \
            infrastructure/docker-compose.sandbox.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint-sandbox/docker-compose.sandbox.yml"
          scp -i ~/.ssh/deploy_key \
            infrastructure/scripts/deploy-remote.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint-sandbox/scripts/deploy-remote.sh"

      # `ssh -n` por la razón de siempre (heredoc/stdin drenado, C1/C2).
      - name: migrar, actualizar y smoke test (con rollback)
        run: |
          ssh -n -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "BASE_DIR=/opt/sellpoint-sandbox COMPOSE_FILE=docker-compose.sandbox.yml SMOKE_DOMAIN=sandbox.sellpointy.com WITH_EDGE=0 bash /opt/sellpoint-sandbox/scripts/deploy-remote.sh '${{ github.sha }}'"

  # Producción solo arranca con el sandbox verde: misma migración, mismo sha.
  deploy:
    name: deploy produccion via ssh + smoke test
    needs: deploy-sandbox
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configurar ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: copiar compose, nginx y php-fpm al server
        run: |
          # mkdir -p de conf.d/, snippets/ y (desde U4) php-fpm/{conf.d,pool.d}
          # COMO deploy, ANTES de que `docker compose up -d` cree el
          # bind-mount de directorio (R9 del proposal vps-multidominio): si
          # Docker lo crea él solo, queda owner root y `deploy` (sin sudo)
          # no puede escribirlo después. Mismo gotcha aplica al servicio
          # php-fpm nuevo (U4): sus dos mounts de config son directorios.
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /opt/sellpoint/nginx/conf.d /opt/sellpoint/nginx/snippets /opt/sellpoint/php-fpm/conf.d /opt/sellpoint/php-fpm/pool.d"
          scp -i ~/.ssh/deploy_key \
            infrastructure/docker-compose.prod.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/docker-compose.prod.yml"
          # conf.d/ y snippets/ son directorios versionados byte-idénticos al
          # repo (D2) — bootstrap/ NUNCA se copia acá, es manual/por script.
          scp -i ~/.ssh/deploy_key -r \
            infrastructure/nginx/conf.d \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/nginx/"
          scp -i ~/.ssh/deploy_key -r \
            infrastructure/nginx/snippets \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/nginx/"
          # php.ini hardening + pools de php-fpm (D4, U4) — también
          # versionados byte-idénticos al repo.
          scp -i ~/.ssh/deploy_key -r \
            infrastructure/php-fpm/conf.d \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/php-fpm/"
          scp -i ~/.ssh/deploy_key -r \
            infrastructure/php-fpm/pool.d \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/php-fpm/"
          # Contexto de build de la imagen php-fpm propia (pdo_pgsql): se
          # buildea EN el server (deploy-remote.sh hace `compose build`),
          # no pasa por GHCR.
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /opt/sellpoint/docker"
          scp -i ~/.ssh/deploy_key \
            infrastructure/docker/php-fpm.Dockerfile \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/docker/php-fpm.Dockerfile"

      # Migrate one-shot → pull+up -d → nginx -t/reload con evidencia →
      # smoke a /api/health → rollback si falla (D10). El script remoto es
      # un ARCHIVO versionado (scripts/deploy-remote.sh) que se copia y se
      # ejecuta por ruta — NUNCA por stdin/heredoc: `docker compose exec -T`
      # deja stdin conectado y un heredoc se lo traga, terminando el script
      # en silencio con exit 0 (C1/C2 del verify vps-multidominio: el
      # reload y el smoke nunca corrieron en 4/4 runs verdes). El `ssh -n`
      # ancla stdin remoto a /dev/null por la misma razón.
      - name: copiar script de deploy al server
        run: |
          scp -i ~/.ssh/deploy_key \
            infrastructure/scripts/deploy-remote.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/scripts/deploy-remote.sh"

      - name: migrar, actualizar y smoke test (con rollback)
        run: |
          ssh -n -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash /opt/sellpoint/scripts/deploy-remote.sh "${{ github.sha }}"
