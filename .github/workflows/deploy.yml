# Deploy a producción. Push a main = deploy (no hay branch protection todavía,
# F0-CI-03 queda para su propio módulo — ver proposal f0-deploy D5).
#
# checks → build-push (3 imágenes a GHCR) → deploy (ssh, migrate, up -d,
# smoke test con rollback automático por reescritura de IMAGE_TAG, D10).
#
# Secrets asumidos (M3 del proposal, los carga Carlos a mano):
#   DEPLOY_SSH_KEY  — privada de ~/.ssh/sellpoint_ci (autoriza SOLO a `deploy`)
#   DEPLOY_HOST     — IP o dominio del server
#   DEPLOY_USER     — deploy
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-push:
    name: build y push imagenes a GHCR
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: build y push api (runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/carloshlm/sellpoint-api:latest
            ghcr.io/carloshlm/sellpoint-api:${{ github.sha }}
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,mode=max,scope=api-runtime

      - name: build y push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          target: migrate
          push: true
          tags: |
            ghcr.io/carloshlm/sellpoint-migrate:latest
            ghcr.io/carloshlm/sellpoint-migrate:${{ github.sha }}
          cache-from: type=gha,scope=api-migrate
          cache-to: type=gha,mode=max,scope=api-migrate

      - name: build y push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: true
          # URL relativa: web y api quedan detrás del mismo origen nginx-edge
          # (D8 del proposal). El default local del ARG en el Dockerfile no
          # se toca — este override es SOLO de este workflow.
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/carloshlm/sellpoint-web:latest
            ghcr.io/carloshlm/sellpoint-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: deploy via ssh + smoke test
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configurar ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: copiar compose, nginx y php-fpm al server
        run: |
          # mkdir -p de conf.d/, snippets/ y (desde U4) php-fpm/{conf.d,pool.d}
          # COMO deploy, ANTES de que `docker compose up -d` cree el
          # bind-mount de directorio (R9 del proposal vps-multidominio): si
          # Docker lo crea él solo, queda owner root y `deploy` (sin sudo)
          # no puede escribirlo después. Mismo gotcha aplica al servicio
          # php-fpm nuevo (U4): sus dos mounts de config son directorios.
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /opt/sellpoint/nginx/conf.d /opt/sellpoint/nginx/snippets /opt/sellpoint/php-fpm/conf.d /opt/sellpoint/php-fpm/pool.d"
          scp -i ~/.ssh/deploy_key \
            infrastructure/docker-compose.prod.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/docker-compose.prod.yml"
          # conf.d/ y snippets/ son directorios versionados byte-idénticos al
          # repo (D2) — bootstrap/ NUNCA se copia acá, es manual/por script.
          scp -i ~/.ssh/deploy_key -r \
            infrastructure/nginx/conf.d \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/nginx/"
          scp -i ~/.ssh/deploy_key -r \
            infrastructure/nginx/snippets \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/nginx/"
          # php.ini hardening + pools de php-fpm (D4, U4) — también
          # versionados byte-idénticos al repo.
          scp -i ~/.ssh/deploy_key -r \
            infrastructure/php-fpm/conf.d \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/php-fpm/"
          scp -i ~/.ssh/deploy_key -r \
            infrastructure/php-fpm/pool.d \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/php-fpm/"

      # Migrate one-shot → pull+up -d → smoke a /api/health → rollback si falla
      # (D10: tags inmutables + rollback por reescritura de IMAGE_TAG en .env,
      # nunca se retaggea el registry). El script vive en el runner y se
      # ejecuta remoto por stdin — así el SHA nuevo viaja como argumento, no
      # hardcodeado en un heredoc que GitHub pudiera interpolar mal.
      - name: migrar, actualizar y smoke test (con rollback)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s -- "${{ github.sha }}" <<'REMOTE_SCRIPT'
          set -euo pipefail
          NEW_TAG="$1"
          cd /opt/sellpoint

          PREV_TAG="$(grep '^IMAGE_TAG=' .env | cut -d= -f2)"
          echo "Tag previo: ${PREV_TAG} -> Tag nuevo: ${NEW_TAG}"

          write_image_tag() {
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$1/" .env
          }

          write_image_tag "${NEW_TAG}"

          echo "Corriendo migraciones (one-shot, antes de tocar la app viva)..."
          # </dev/null es OBLIGATORIO: sin esto, "docker compose run" hereda el
          # stdin de este script (el resto del heredoc SSH) y se lo traga como
          # si fuera input del contenedor. bash llega a EOF prematuro y el
          # script termina en silencio con exit 0 DESPUES de migrate, sin
          # correr pull/up -d/smoke/prune y sin que el job falle (bug real
          # encontrado en el primer run de produccion, 2026-08-06).
          if ! docker compose -f docker-compose.prod.yml run --rm migrate < /dev/null; then
            echo "Migración FALLÓ. Revirtiendo IMAGE_TAG a ${PREV_TAG} sin desplegar."
            write_image_tag "${PREV_TAG}"
            exit 1
          fi

          echo "Pull + up -d..."
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d

          # Regla dura (D2 del proposal vps-multidominio): los cambios de
          # config de nginx SIEMPRE se validan con `nginx -t` antes de
          # aplicarlos con `nginx -s reload`. NUNCA --force-recreate para
          # config: un vhost roto en un `-t` fallido dejar corriendo la
          # config VIEJA (los 3 sitios siguen arriba); un force-recreate con
          # el mismo error tira nginx entero.
          # up -d de arriba NO reinicia nginx-edge si el bind-mount de
          # conf.d/snippets ya existía (el contenido de los archivos ya
          # cambió en disco por el scp, pero el proceso nginx sigue con la
          # config vieja cargada en memoria) — por eso el -t/-s reload
          # explícito de acá es indispensable en TODO deploy, no solo el
          # primero.
          echo "Validando config de nginx (nginx -t)..."
          if ! docker compose -f docker-compose.prod.yml exec -T nginx-edge nginx -t; then
            echo "nginx -t FALLÓ. Abortando deploy SIN recargar (la config vieja sigue sirviendo)."
            exit 1
          fi
          echo "nginx -t OK. Recargando (nginx -s reload)..."
          docker compose -f docker-compose.prod.yml exec -T nginx-edge nginx -s reload

          # --resolve contra el origen, no https://laradoc.com (S5 del verify
          # de f0-deploy, cerrado por D1/U3 del proposal vps-multidominio):
          # pegarle a través de Cloudflare hace que una caída de CF dispare
          # un rollback espurio de un deploy sano. Con --resolve se ejercita
          # el vhost real de system.laradoc.com, el TLS real y el strip de
          # /api real, sin depender del DNS público ni de la salida a
          # internet — la app YA vive en system.laradoc.com (D1).
          echo "Smoke test /api/health en system.laradoc.com, contra el origen (hasta 30 intentos x 5s)..."
          SMOKE_OK=0
          for i in $(seq 1 30); do
            if curl -fsS --resolve system.laradoc.com:443:127.0.0.1 https://system.laradoc.com/api/health > /dev/null; then
              SMOKE_OK=1
              break
            fi
            sleep 5
          done

          if [ "${SMOKE_OK}" -eq 1 ]; then
            echo "Smoke OK. Limpiando imagenes viejas."
            docker image prune -f
          else
            echo "Smoke FALLÓ. Rollback a ${PREV_TAG}."
            write_image_tag "${PREV_TAG}"
            docker compose -f docker-compose.prod.yml up -d
            # Re-verificación del rollback: no cambia el resultado del job
            # (que igual queda ROJO, D10), es solo para dejar registro en el
            # log de si el rollback devolvió el server a un estado sano.
            for i in $(seq 1 10); do
              if curl -fsS --resolve system.laradoc.com:443:127.0.0.1 https://system.laradoc.com/api/health > /dev/null; then
                echo "Rollback verificado: /api/health responde con el tag previo."
                break
              fi
              sleep 5
            done
            exit 1
          fi
          REMOTE_SCRIPT
