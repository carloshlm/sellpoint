# Deploy al SANDBOX (sandbox.sellpointy.com). Push a develop = deploy al
# stack sandbox del MISMO server (dos ambientes, 2026-08-26).
#
# Mismo esqueleto que Deploy (checks → build-push → ssh) con tres diferencias
# deliberadas:
#   1. Las imágenes van a los MISMOS repos GHCR pero SOLO con el tag del sha
#      — `latest` es de main y este workflow jamás lo toca.
#   2. El destino es /opt/sellpoint-sandbox y el script corre con overrides:
#      COMPOSE_FILE/SMOKE_DOMAIN propios y WITH_EDGE=0 (el sandbox no tiene
#      nginx ni php-fpm — su tráfico entra por el edge de producción vía la
#      red compartida, así que el smoke ejercita la cadena completa).
#   3. No se copian configs de nginx/php-fpm: pertenecen a producción.
#
# Mismos secrets que Deploy: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER.
name: Deploy Sandbox

on:
  push:
    branches: [develop]
    # Solo documentación no despliega (Carlos, 2026-09-04): un .md no lo lee
    # ninguna prueba ni ningún build, y correr 7 minutos de suites para
    # validarlo es tiempo de runner tirado. Si el push mezcla docs con código,
    # GitHub evalúa el conjunto y corre completo. `workflow_dispatch` sigue
    # disponible para forzar un deploy a mano.
    paths-ignore:
      - "**.md"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-push:
    name: build y push imagenes a GHCR (solo tag sha)
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup buildx
        uses: docker/setup-buildx-action@v4

      - name: build y push api (runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/carloshlm/sellpoint-api:${{ github.sha }}
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,mode=max,scope=api-runtime

      - name: build y push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          target: migrate
          push: true
          tags: |
            ghcr.io/carloshlm/sellpoint-migrate:${{ github.sha }}
          cache-from: type=gha,scope=api-migrate
          cache-to: type=gha,mode=max,scope=api-migrate

      - name: build y push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: true
          # URL relativa (D8): la MISMA imagen sirve en prod y sandbox — el
          # ambiente lo decide el vhost que la sirve, no el build.
          build-args: |
            VITE_API_URL=/api
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          tags: |
            ghcr.io/carloshlm/sellpoint-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: deploy sandbox via ssh + smoke test
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configurar ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: copiar compose y script al server
        run: |
          # mkdir COMO deploy antes de cualquier bind-mount (R9): si Docker
          # crea el directorio, queda owner root.
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /opt/sellpoint-sandbox/scripts"
          scp -i ~/.ssh/deploy_key \
            infrastructure/docker-compose.sandbox.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint-sandbox/docker-compose.sandbox.yml"
          scp -i ~/.ssh/deploy_key \
            infrastructure/scripts/deploy-remote.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint-sandbox/scripts/deploy-remote.sh"

      # El MISMO script curtido de producción, con overrides de ambiente.
      # `ssh -n` por la razón de siempre (heredoc/stdin drenado, C1/C2).
      - name: migrar, actualizar y smoke test (con rollback)
        run: |
          ssh -n -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "BASE_DIR=/opt/sellpoint-sandbox COMPOSE_FILE=docker-compose.sandbox.yml SMOKE_DOMAIN=sandbox.sellpointy.com WITH_EDGE=0 bash /opt/sellpoint-sandbox/scripts/deploy-remote.sh '${{ github.sha }}'"
