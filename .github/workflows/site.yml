# Sitio público (F11-SITE-INFRA-04): construir `apps/site` y publicarlo en
# sellpointy.com como archivos, sin imágenes de Docker y sin tocar la app.
#
# checks → build (pnpm, hash de la CSP, candado legal, tar) → deploy (ssh,
# release atómica, prueba de humo, rollback si falla).
#
# DOS DESTINOS, y lo que recibe cada uno lo decide este workflow, no nginx:
#
#   · ensayo      → `website-sandbox.sellpointy.com`: SIEMPRE el sitio completo
#                   (con `noindex` desde su vhost). Para eso existe.
#   · producción  → `sellpointy.com`: la página «en construcción» hasta que el
#                   dueño prenda la variable `SITE_PUBLISH_FULL`. Con ella
#                   prendida, el candado legal (F11-SITE-LEGAL-01) detiene todo
#                   si `SITIO-WEB-LEGAL.md` conserva un solo hueco `[[…]]`.
#
# El job de deploy entero está detrás de `SITE_DEPLOY_ENABLED`: mientras no
# valga exactamente `true`, se SALTA (no falla). La operación —primer
# despliegue, certificados, cómo publicar el sitio completo, cómo volver
# atrás— está en `infrastructure/nginx/SITIO-PUBLICO.md`.
#
# Por qué un workflow aparte y no un job dentro de `deploy.yml`: el sitio es
# HTML en disco, se publica en segundos y no toca la base ni las imágenes.
# Colgarlo del pipeline de la app le costaría ~18 minutos a cada corrección de
# una coma, y un fallo suyo pondría en rojo un deploy de producción con el que
# no tiene nada que ver.
#
# Secrets: los MISMOS de `deploy.yml` (DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER).
# No hay credenciales nuevas que cargar.
name: Sitio

on:
  push:
    branches: [main]
    # Lista EXPLÍCITA, no `paths-ignore`: este pipeline solo tiene sentido
    # cuando cambia el sitio o lo que lo publica.
    paths:
      - "apps/site/**"
      # El sitio lee de acá los planes que muestra la vitrina (F11-SITE-PLANS):
      # un cambio de precio tiene que republicar el sitio aunque `apps/site/`
      # no se haya tocado.
      - "packages/shared/src/plan-showcase.ts"
      - "infrastructure/scripts/site-*.sh"
      - "infrastructure/nginx/conf.d/sellpointy.com.conf"
      - "infrastructure/nginx/conf.d/website-sandbox.sellpointy.com.conf"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Grupo propio: una publicación del sitio no debe cancelar ni esperar a un
# deploy de la aplicación, y viceversa. `cancel-in-progress: false` por la
# misma razón que en `deploy.yml`: cancelar a mitad de un despliegue deja el
# server en un estado que nadie eligió.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # La misma única fuente de verdad de «el código está sano» que usan `ci.yml`
  # y `deploy.yml`. Incluye los tests del sitio (`pnpm test` corre su vitest).
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    name: construir el sitio y empaquetarlo
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # Estos dos no necesitan node ni dependencias: son bash puro y revisan
      # decisiones que `nginx -t` no ve (que el apex no sea una puerta al API,
      # que el vhost no esté en conf.d todavía, que el enlace de release se
      # mueva atómicamente). Van primero porque fallan en segundos.
      - name: tests de los scripts y los vhosts del sitio
        run: |
          bash infrastructure/scripts/site-vhost.test.sh
          bash infrastructure/scripts/site-deploy-remote.test.sh

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts=false

      # `site...` con los tres puntos = el paquete Y SUS DEPENDENCIAS. El sitio
      # importa `@sellpoint/shared`, y con `--filter site` a secas el build
      # corre sin `shared/dist` y muere con "Cannot find module
      # '@sellpoint/shared'" — en local pasa igual solo porque el dist quedó de
      # una corrida anterior.
      - name: construir el sitio (y shared antes)
        run: pnpm --filter site... build

      # La CSP del vhost autoriza por HASH el único guion en línea del sitio
      # (el del tema). Si alguien le cambia una coma, el navegador deja de
      # ejecutarlo y el tema guardado deja de aplicarse: no lo ve ningún test
      # ni ningún build, solo un cliente. Esta barrera recalcula el hash desde
      # el HTML construido y compara contra los dos vhosts.
      - name: el hash del guion del tema coincide con la CSP
        run: bash infrastructure/scripts/site-csp-hash.sh

      # F11-SITE-LEGAL-01 — el candado. El texto legal se lee de
      # `SITIO-WEB-LEGAL.md` al construir y todavía trae huecos `[[…]]` que
      # solo el dueño puede llenar. Uno solo que llegue a producción es un
      # documento legal incompleto publicado con nuestro nombre, y eso no lo
      # arregla un hotfix.
      #
      # ⚠️ Se busca el hueco COMPLETO (`[[` … `]]`) y NO la cadena `[[` a
      # secas: un bundle minificado tiene arreglos anidados y hoy mismo
      # `MarketNotice…js` contiene `u=[[`. Un candado que se pone rojo por una
      # razón falsa es un candado que alguien termina apagando.
      # `-I` salta los binarios (las fuentes y los PNG).
      #
      # Bloquea PUBLICAR, no construir: mientras el despliegue esté apagado
      # (`SITE_DEPLOY_ENABLED`), los huecos son un AVISO y el workflow sigue en
      # verde — un rojo permanente es un rojo que todos aprenden a ignorar, y el
      # día que fallara por algo real nadie lo vería. Con el despliegue
      # prendido, un solo hueco detiene todo antes de empaquetar.
      - name: candado legal (ningún hueco sin llenar puede publicarse)
        env:
          PUBLISH_FULL: ${{ vars.SITE_PUBLISH_FULL }}
        run: |
          if grep -RIlE '\[\[[^]]*\]\]' apps/site/dist; then
            echo ""
            echo "Las páginas de arriba traen huecos legales sin llenar (F11-SITE-LEGAL-01)."
            echo "Se llenan en SITIO-WEB-LEGAL.md, que es de donde el build lee el texto."
            if [ "$PUBLISH_FULL" = "true" ]; then
              echo "FALLA: SITE_PUBLISH_FULL está prendida y el sitio completo NO es publicable."
              exit 1
            fi
            echo "::warning title=Sitio completo no publicable::Quedan huecos [[…]] en las páginas legales. Producción sirve la página «en construcción»; el sitio completo solo va al de ensayo."
            exit 0
          fi
          echo "OK: no quedan huecos [[…]] en apps/site/dist."

      # F11-SITE-SEO-03 — el presupuesto de rendimiento, como prueba que FALLA:
      # rendimiento ≥ 95, accesibilidad = 100, titular pintado < 2.5 s, salto de
      # diseño < 0.1, menos de 50 KB de JavaScript y cero recursos de terceros
      # (`apps/site/lighthouserc.json`). Un presupuesto que no rompe la
      # construcción es una intención.
      - name: presupuesto de rendimiento (Lighthouse)
        run: pnpm --filter site lighthouse

      # Lo que sirve PRODUCCIÓN mientras lo legal no esté listo (Carlos,
      # 2026-09-19): una sola página, «sitio en construcción», con las dos
      # puertas de la aplicación. Se construye SIEMPRE, para que el día que haga
      # falta volver a ella esté probada. Esta sí tiene candado duro: es justo lo
      # que se publica mientras existan los huecos, así que no puede traer ninguno.
      - name: construir la página «en construcción»
        run: pnpm --filter site exec astro build --silent --outDir dist-construction
        env:
          SITE_MODE: construction

      - name: la página en construcción no trae huecos y su guion coincide con la CSP
        run: |
          if grep -RIlE '\[\[[^]]*\]\]' apps/site/dist-construction; then
            echo "FALLA: la página «en construcción» trae huecos legales."
            exit 1
          fi
          # El script recibe un ARCHIVO (una carpeta la da por inexistente). En
          # este modo hay una sola página con guion: la raíz.
          bash infrastructure/scripts/site-csp-hash.sh apps/site/dist-construction/index.html \
            infrastructure/nginx/conf.d/sellpointy.com.conf

      # El contrato de cada paquete: el CONTENIDO de la carpeta en la raíz del
      # tar. Es lo que `site-deploy-remote.sh` espera, y por eso verifica que
      # exista `index.html` arriba de todo antes de mover nada.
      - name: empaquetar los dos
        run: |
          tar -czf sitio-completo.tgz -C apps/site/dist .
          tar -czf sitio-construccion.tgz -C apps/site/dist-construction .

      - name: subir los paquetes
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: |
            sitio-completo.tgz
            sitio-construccion.tgz
          retention-days: 7

  deploy:
    name: publicar en ${{ matrix.target }} via ssh + prueba de humo
    # ⚠️ El interruptor. Sin la variable de repositorio en `true`, este job se
    # SALTA — no falla.
    if: vars.SITE_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # Primero el de ensayo: si su humo falla, producción no se toca.
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          # El sitio de ENSAYO recibe siempre el sitio completo, huecos incluidos:
          # para eso existe. Va con `noindex` desde su vhost.
          - target: ensayo
            domain: website-sandbox.sellpointy.com
            package: completo
          # PRODUCCIÓN sirve la página «en construcción» hasta que Carlos prenda
          # `SITE_PUBLISH_FULL` — y con ella prendida, el candado legal del job
          # `build` ya detuvo todo si quedaba un solo hueco.
          - target: produccion
            domain: sellpointy.com
            package: ${{ vars.SITE_PUBLISH_FULL == 'true' && 'completo' || 'construccion' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: bajar los paquetes
        uses: actions/download-artifact@v4
        with:
          name: sitio

      - name: configurar ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: copiar el paquete y el script al server
        run: |
          # `mkdir` COMO deploy ANTES de cualquier bind-mount (R9 del proposal
          # vps-multidominio): si lo crea Docker, queda owner root y `deploy`
          # (que no tiene sudo) no puede escribir adentro nunca más.
          # `/opt/sites` es justamente un bind-mount de nginx-edge.
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /opt/sites/${{ matrix.domain }}/releases /opt/sellpoint/scripts"
          scp -i ~/.ssh/deploy_key "sitio-${{ matrix.package }}.tgz" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/sitio-${{ matrix.target }}-${{ github.sha }}.tgz"
          scp -i ~/.ssh/deploy_key infrastructure/scripts/site-deploy-remote.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/sellpoint/scripts/site-deploy-remote.sh"

      # El script se ejecuta por RUTA, nunca por stdin/heredoc, y con `ssh -n`:
      # es la misma regla dura de `deploy.yml` (C1/C2 del verify
      # vps-multidominio), donde un heredoc drenado hizo que el reload y el
      # smoke no corrieran nunca mientras el job reportaba verde.
      # La release se nombra con el sha Y el paquete: pasar de «construcción» al
      # sitio completo en el mismo commit tiene que ser una release distinta.
      - name: publicar la release (enlace atómico)
        run: |
          ssh -n -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "SITE_ROOT=/opt/sites/${{ matrix.domain }} bash /opt/sellpoint/scripts/site-deploy-remote.sh '${{ github.sha }}-${{ matrix.package }}' '/tmp/sitio-${{ matrix.target }}-${{ github.sha }}.tgz'"

      # `--resolve` contra el origen y no a través de Cloudflare (S5 de f0): se
      # ejercita el vhost real y el TLS real, y una caída del edge ajeno no
      # dispara un rollback espurio.
      #
      # Sitio completo: las cinco rutas, cada una con su `hreflang` — cada
      # mercado es una página distinta y un build a medias puede dejar una sola
      # rota. En construcción: la raíz, con las puertas de la aplicación, y las
      # rutas viejas que los clientes tienen guardadas siguen llegando a ella.
      - name: prueba de humo
        run: |
          ssh -n -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            dominio="${{ matrix.domain }}"
            pedir() { curl -s -o /tmp/humo.html -w "%{http_code}" --resolve "${dominio}:443:127.0.0.1" "https://${dominio}$1"; }
            if [ "${{ matrix.package }}" = "completo" ]; then
              for ruta in /es-mx/ /en-us/ /es-us/ /en-ca/ /fr-ca/; do
                codigo=$(pedir "$ruta")
                [ "$codigo" = "200" ] || { echo "FALLA: ${ruta} respondió ${codigo}"; exit 1; }
                grep -q "hreflang=\"x-default\"" /tmp/humo.html || { echo "FALLA: ${ruta} no declara hreflang (F11-SITE-SEO-01)"; exit 1; }
                echo "OK ${ruta}"
              done
            else
              codigo=$(pedir /)
              [ "$codigo" = "200" ] || { echo "FALLA: / respondió ${codigo}"; exit 1; }
              grep -q "app.sellpointy.com/login" /tmp/humo.html || { echo "FALLA: la página en construcción no enlaza a la aplicación"; exit 1; }
              echo "OK / (en construcción)"
            fi
            codigo=$(pedir /login)
            case "$dominio" in
              sellpointy.com) [ "$codigo" = "301" ] || { echo "FALLA: /login respondió ${codigo}, y tenía que seguir llegando a la aplicación"; exit 1; }; echo "OK /login → aplicación" ;;
            esac
          '

      # Si la publicación o el humo fallaron, el enlace vuelve a la release
      # anterior. Es barato porque volver atrás es mover un enlace: no hay
      # migraciones que deshacer ni imágenes que bajar.
      - name: rollback si algo falló
        if: failure()
        run: |
          ssh -n -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "SITE_ROOT=/opt/sites/${{ matrix.domain }} bash /opt/sellpoint/scripts/site-deploy-remote.sh --rollback"
