<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    F4-PWA-01 — el icono `maskable`.

    Distinto del favicon a propósito. Android RECORTA el icono de la app con la
    forma que el fabricante elija —círculo, cuadrado redondeado, gota— así que
    todo lo importante tiene que caber en el 80% central. El favicon llena su
    lienzo de borde a borde: usado como maskable, el sistema le cortaría las
    puntas del rayo.

    Acá el símbolo va al 60% sobre un fondo sólido, que es lo que garantiza que
    ningún recorte se lleve nada ni deje esquinas transparentes.
  -->
  <title>SellPoint</title>
