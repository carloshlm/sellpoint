packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true

# Versiones forzadas por seguridad. Cada una dice por qué y se quita cuando la
# dependencia que la trae ya pide la versión arreglada por su cuenta.
overrides:
  # CVE-2026-90711 (crítico): proxy-addr 2.0.7 permite suplantar la IP del
  # cliente, y de esa IP dependen el límite de intentos y la auditoría. La trae
  # express (Nest); trivy la marcó en el deploy del 2026-10-21.
  "proxy-addr@<2.0.8": "2.0.8"
